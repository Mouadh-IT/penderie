<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Penderie</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Penderie">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E3E7EA; --paper:#F7F8F6; --paper-ink:#56637A; --surface:#FFFFFF; --ink:#1C2638; --muted:#5F6B7C;
  --line:#CDD4DA; --seam:#8994A5; --dot:#BAC4CF; --accent:#C93A5B; --on-accent:#FFFFFF; --ok:#2E7D5B;
  --shadow:rgba(28,38,56,.14); --shadow-lg:rgba(28,38,56,.22); --chip:#EEF1F3;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161B24; --paper:#DDE1E4; --paper-ink:#4E5A6E; --surface:#202734; --ink:#E7EBF1; --muted:#9AA5B5;
    --line:#323B4A; --seam:#7F8A9B; --dot:#AEB8C3; --accent:#E45C7D; --on-accent:#FFFFFF; --ok:#5DBB8F;
    --shadow:rgba(0,0,0,.35); --shadow-lg:rgba(0,0,0,.5); --chip:#2A3241;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161B24; --paper:#DDE1E4; --paper-ink:#4E5A6E; --surface:#202734; --ink:#E7EBF1; --muted:#9AA5B5;
  --line:#323B4A; --seam:#7F8A9B; --dot:#AEB8C3; --accent:#E45C7D; --on-accent:#FFFFFF; --ok:#5DBB8F;
  --shadow:rgba(0,0,0,.35); --shadow-lg:rgba(0,0,0,.5); --chip:#2A3241;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}
main{max-width:520px;margin:0 auto;padding:10px 16px calc(100px + env(safe-area-inset-bottom,0px))}

/* Headers */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:10px 0 14px}
h1{margin:0;font-size:40px;line-height:.9;font-weight:840;font-stretch:62%;letter-spacing:-.005em}
.sub{margin:6px 0 0;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .12s}
.icon:active{transform:scale(.94)}
.icon.hot{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icon:disabled,.pill:disabled{opacity:.4;cursor:default}
.pill{height:42px;padding:0 14px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);background:transparent;font-weight:660;font-size:15px;cursor:pointer}
.h2{margin:22px 2px 10px;font-size:22px;font-weight:800;font-stretch:66%;line-height:1}

/* Context switches */
.ctx{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{min-height:34px;border:0;background:none;border-radius:9px;font-size:13.5px;font-weight:580;color:var(--muted);cursor:pointer;padding:0 2px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

/* Pattern paper */
.dots{background-color:var(--paper);background-image:radial-gradient(circle,var(--dot) 1px,transparent 1.6px);background-size:18px 18px;background-position:center}
.paper{position:relative;display:flex;justify-content:center;padding:22px 0 24px;border-radius:12px;
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px -12px var(--shadow-lg),0 0 0 1px var(--line);
  --u:calc((min(100vw, 520px) - 56px) / 420)}
.reg{position:absolute;width:14px;height:14px;pointer-events:none;opacity:.75}
.reg.a{top:10px;left:10px;border-top:1.5px solid var(--accent);border-left:1.5px solid var(--accent)}
.reg.b{top:10px;right:10px;border-top:1.5px solid var(--accent);border-right:1.5px solid var(--accent)}
.reg.c{bottom:10px;left:10px;border-bottom:1.5px solid var(--accent);border-left:1.5px solid var(--accent)}
.reg.d{bottom:10px;right:10px;border-bottom:1.5px solid var(--accent);border-right:1.5px solid var(--accent)}

/* Outfit layout (420u wide) */
.outfit{display:grid;width:calc(420 * var(--u));
  grid-template-columns:calc(90 * var(--u)) calc(240 * var(--u)) calc(90 * var(--u));
  grid-template-rows:calc(72 * var(--u)) calc(42 * var(--u)) calc(214 * var(--u)) calc(214 * var(--u)) calc(56 * var(--u)) calc(84 * var(--u));
  row-gap:calc(8 * var(--u));
  grid-template-areas:". tete ." ". yeux ." "mg torse md" ". bas ." ". chaussettes ." ". pieds ."}
.slot{position:relative;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:none;
  touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.live .slot{cursor:pointer}
.slot img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none;
  filter:drop-shadow(0 calc(4 * var(--u)) calc(5 * var(--u)) rgba(28,38,56,.22))}
img.opaque{mix-blend-mode:multiply;filter:none !important}
.live .slot.empty{border:1.5px dashed var(--seam);border-radius:calc(14 * var(--u));background:var(--paper)}
.ph{font-size:calc(15 * var(--u));line-height:1.1;font-weight:580;font-stretch:84%;color:var(--paper-ink);text-align:center;padding:0 4px}
.lk{position:absolute;top:-4px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;z-index:4;box-shadow:0 2px 6px var(--shadow)}
.s-tete{grid-area:tete;justify-self:center;width:62%;height:100%}
.s-yeux{grid-area:yeux;justify-self:center;width:48%;height:100%}
.torse{grid-area:torse;position:relative;display:block}
.s-dessus{position:absolute;left:0;top:0;width:64%;height:100%}
.s-haut{position:absolute;right:0;top:5%;width:64%;height:95%;z-index:2}
.live .s-dessus.empty{justify-content:flex-start;align-items:flex-start;padding:calc(12 * var(--u)) 0 0 calc(10 * var(--u))}
.live .s-dessus.empty .ph{max-width:50%;text-align:left;padding:0}
.torse[data-s="dessus"] .s-dessus{left:18%}
.torse[data-s="haut"] .s-haut{right:18%;top:0;height:100%}
.live .torse[data-s="dessus"] .s-haut,
.live .torse[data-s="haut"] .s-dessus{width:auto;height:calc(34 * var(--u));padding:0 calc(10 * var(--u));border-radius:999px;align-items:center}
.live .torse[data-s="dessus"] .s-haut{right:0;top:auto;bottom:0}
.live .torse[data-s="haut"] .s-dessus{left:0;top:0;z-index:3}
.live .torse[data-s="haut"] .s-dessus .ph{max-width:none}
.s-mg{grid-area:mg;align-self:end;justify-self:start;width:86%;height:calc(110 * var(--u))}
.s-md{grid-area:md;align-self:end;justify-self:end;width:86%;height:calc(110 * var(--u))}
.s-bas{grid-area:bas;width:100%;height:100%}
.s-chaussettes{grid-area:chaussettes;justify-self:center;width:52%;height:100%}
.s-pieds{grid-area:pieds;justify-self:center;width:76%;height:100%}

@keyframes inR{from{transform:translateX(22%);opacity:0}to{transform:none;opacity:1}}
@keyframes inL{from{transform:translateX(-22%);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-14%) scale(.94);opacity:0}to{transform:none;opacity:1}}
.slot img.in-r{animation:inR .24s cubic-bezier(.2,.8,.2,1)}
.slot img.in-l{animation:inL .24s cubic-bezier(.2,.8,.2,1)}
.slot img.drop{animation:drop .42s cubic-bezier(.2,.8,.2,1) both}

.under{display:flex;justify-content:center;gap:8px;margin-top:12px}
.ghost{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.hint{font-size:13.5px;color:var(--muted);text-align:center;margin:12px 8px 0;line-height:1.45}

/* Hang tag */
.tag{position:relative;margin:16px auto 0;background:#FBFBF8;color:#1C2638;border-radius:12px;padding:14px 16px 14px 46px;
  box-shadow:0 8px 24px -10px var(--shadow-lg),0 0 0 1px rgba(28,38,56,.08)}
.tag::before{content:"";position:absolute;left:17px;top:22px;width:12px;height:12px;border-radius:50%;background:var(--bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.25)}
.tag::after{content:"";position:absolute;left:23px;top:34px;bottom:14px;border-left:1.5px dashed rgba(28,38,56,.22)}
.tag .sc{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.tag .sc b{font-size:40px;font-weight:850;font-stretch:62%;line-height:.9;font-variant-numeric:tabular-nums}
.tag .sc span{font-size:15px;font-weight:650}
.tag ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.tag li{font-size:13.5px;line-height:1.38;padding-left:16px;position:relative;color:#2A3547}
.tag li::before{content:"";position:absolute;left:0;top:.42em;width:7px;height:7px;border-radius:50%;background:#2E7D5B}
.tag li.bad::before{background:#C93A5B}
.tag .rules{margin-top:10px;background:none;border:0;padding:0;color:#C93A5B;font-weight:650;font-size:13.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Wardrobe */
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  font-size:14px;font-weight:550;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex-shrink:0}
.chip.sm{min-height:32px;font-size:13.5px;padding:0 11px}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .ct{font-size:12px;opacity:.6;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;padding:0;border:0;background:none;text-align:left;cursor:pointer;min-width:0;position:relative}
.tile .ti{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;width:100%;background:var(--paper);
  border-radius:12px;padding:12%;overflow:hidden;color:var(--paper-ink);font-weight:600;font-size:14px;text-align:center;
  box-shadow:0 0 0 1px var(--line),0 6px 16px -10px var(--shadow-lg);transition:transform .15s}
.tile:active .ti{transform:scale(.97)}
.tile .ti img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(28,38,56,.2))}
.tile .tl{font-size:13px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tile.on .ti{box-shadow:0 0 0 2.5px var(--accent)}
.tile.dash .ti{box-shadow:none;border:1.5px dashed var(--seam)}
.dotc{position:absolute;left:8px;top:8px;width:11px;height:11px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 0 2.5px rgba(28,38,56,.15)}
.nolab{position:absolute;right:7px;top:7px;font-size:10.5px;font-weight:700;color:#C93A5B;background:#fff;border-radius:6px;padding:2px 5px;box-shadow:0 0 0 1px rgba(201,58,91,.35)}
.check{position:absolute;right:8px;top:8px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center}

/* Laundry */
.basket{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:4px 16px 8px;scrollbar-width:none}
.basket::-webkit-scrollbar{display:none}
.bk{position:relative;width:70px;flex-shrink:0}
.bk .ti{width:70px;height:84px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);border-radius:12px;padding:8px;box-shadow:0 0 0 1px var(--line);border:0;cursor:pointer}
.bk .ti img{width:100%;height:100%;object-fit:contain;display:block}
.bk .rm{position:absolute;right:-5px;top:-5px;width:24px;height:24px;border-radius:50%;border:0;background:var(--ink);color:var(--surface);display:grid;place-items:center;cursor:pointer}
.load{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line),0 10px 24px -16px var(--shadow-lg)}
.load-head{display:flex;gap:14px;align-items:center}
.drum{--in:#F2F4F3;--tx:#1C2638;width:78px;height:78px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle,var(--in) 0 55%,#C9D0D7 56% 62%,#E9EDF0 63% 100%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.drum::after{content:"";position:absolute;inset:14px;border-radius:50%;border:1.5px dashed rgba(28,38,56,.25)}
.drum b{font-size:25px;font-weight:850;font-stretch:62%;color:var(--tx);position:relative;z-index:1}
.g-blanc .drum{--in:#FFFFFF}
.g-clair .drum{--in:#EFE7D6}
.g-couleur .drum{--in:#E7C3CB}
.g-fonce .drum{--in:#2B3444;--tx:#F2F4F7}
.g-apart .drum{--in:#F0C8B3}
.g-main .drum{--in:#DCE6F0}
.lh h3{margin:0;font-size:22px;font-weight:820;font-stretch:66%;line-height:1}
.lh p{margin:5px 0 0;font-size:14px;color:var(--muted);line-height:1.35}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{font-size:12.5px;padding:5px 10px;border-radius:999px;background:var(--chip);font-weight:560}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.thumbs button{width:50px;height:60px;background:var(--paper);border-radius:9px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:5px;border:0;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.thumbs img{width:100%;height:100%;object-fit:contain;display:block}
.notes{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.notes li{font-size:13.5px;line-height:1.4;padding-left:18px;position:relative}
.notes li::before{content:"";position:absolute;left:2px;top:.55em;width:8px;border-top:1.5px dashed var(--seam)}
.notes li.w::before{border-color:var(--accent)}
.load .done{margin-top:14px}

/* Care label (woven ribbon) */
.ribbon{display:inline-flex;align-items:center;gap:12px;padding:11px 16px;background:#F4F2EC;color:#1E2A4A;border-radius:3px;position:relative;
  box-shadow:0 1px 3px rgba(0,0,0,.14),inset 0 0 0 1px rgba(30,42,74,.06)}
.ribbon::before,.ribbon::after{content:"";position:absolute;left:5px;right:5px;border-top:1px dashed rgba(30,42,74,.3)}
.ribbon::before{top:4px}.ribbon::after{bottom:4px}
.ribbon svg{width:27px;height:29px;display:block}
.cbox{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.ctext{font-size:13.5px;color:var(--muted);line-height:1.4;margin:0}

/* Saved outfits */
.og{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ocard{display:flex;flex-direction:column;gap:8px;padding:0;border:0;background:none;text-align:left;cursor:pointer;min-width:0}
.opaper{display:flex;justify-content:center;padding:12px 0;border-radius:12px;box-shadow:0 0 0 1px var(--line),0 8px 20px -14px var(--shadow-lg);
  --u:calc(((min(100vw, 520px) - 44px) / 2 - 22px) / 420)}
.oname{font-size:14px;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.prev-mid{display:flex;justify-content:center;padding:14px 0;border-radius:12px;box-shadow:0 0 0 1px var(--line);--u:calc(170px / 420);margin-bottom:12px}
.big{display:flex;justify-content:center;align-items:center;height:250px;border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:18px}
.big img{max-width:100%;max-height:100%;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(28,38,56,.22))}

/* Empty states */
.empty{text-align:center;padding:26px 16px 10px;color:var(--muted)}
.empty svg{color:var(--seam);margin-bottom:10px}
.empty p{margin:0 auto 16px;line-height:1.45;max-width:30ch}
.empty .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.loading{padding-top:38vh;text-align:center;color:var(--muted)}

/* Nav + FAB */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:20}
.tabs .in{display:flex;width:100%;max-width:520px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 5px;background:none;border:0;
  color:var(--muted);font-size:11.5px;font-weight:580;position:relative;cursor:pointer}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:30px;border-top:2px dashed var(--accent)}
.tab .bdg{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.fab{position:fixed;right:max(16px, calc(50vw - 244px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);border:0;
  box-shadow:0 8px 22px var(--shadow-lg);display:grid;place-items:center;z-index:15;cursor:pointer}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(16,22,32,0);transition:background .2s}
.sheet.open{background:rgba(16,22,32,.45)}
.sheet-card{width:100%;max-width:520px;max-height:calc(100% - 36px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;
  background:var(--surface);border-radius:20px 20px 0 0;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1)}
.sheet-card::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.sheet.open .sheet-card{transform:none}
@media (prefers-reduced-motion: reduce){
  .sheet-card,.sheet{transition:none}
  .slot img.in-r,.slot img.in-l,.slot img.drop{animation:none}
}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.sh-head h2{margin:0;font-size:28px;font-weight:820;font-stretch:64%;line-height:1;min-width:0;overflow-wrap:anywhere}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex-shrink:0}
.foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));margin:16px -16px calc(-20px - env(safe-area-inset-bottom,0px));
  padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:5}

.drop{position:relative;height:210px;border-radius:14px;border:1.5px dashed var(--seam);overflow:hidden;
  background:conic-gradient(#E7EAED 25%,#F8F9FA 0 50%,#E7EAED 0 75%,#F8F9FA 0) 0 0/18px 18px}
.drop.lab{height:140px}
.drop.has{border-style:solid;border-color:var(--line)}
.drop:focus-within{border-color:var(--accent)}
.drop .pv{position:absolute;inset:12px;width:calc(100% - 24px);height:calc(100% - 24px);object-fit:contain}
.paste{position:absolute;inset:0;outline:none;color:transparent;caret-color:transparent;overflow:hidden;
  display:flex;align-items:center;justify-content:center;-webkit-user-select:text;user-select:text;cursor:text}
.paste:empty::before{content:attr(data-ph);color:#56637A;font-size:15.5px;font-weight:580;pointer-events:none;padding:0 20px;text-align:center;line-height:1.35}
.drop.has .paste::before{content:none}

function hexRgb(h){ h = String(h || '').replace('#',''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }

function dominantColor(img, W, H, transparent){
  const N = 56;

  const x = c.getContext('2d', {willReadFrequently:true});

    for (let i = 0; i < pts.length; i++) {
      let bi = 0, bd = Infinity;
      for (let k = 0; k < K; k++) { const l = pts[i].lab, cc = cent[k]; const dd = (l[0]-cc[0])**2 + (l[1]-cc[1])**2 + (l[2]-cc[2])**2; if (dd < bd) { bd = dd; bi = k; } }

    }

function localStore(){
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('penderie', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('items')) d.createObjectStore('items', {keyPath:'id'});
      if (!d.objectStoreNames.contains('outfits')) d.createObjectStore('outfits', {keyPath:'id'});
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = async (name, mode, fn) => {
    const d = await open();
    return new Promise((res, rej) => {
      const t = d.transaction(name, mode);
      const q = fn(t.objectStore(name));
      t.oncomplete = () => res(q ? q.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  const urls = new Map();
  const url = (key, blob) => { if (!blob) return ''; if (!urls.has(key)) urls.set(key, URL.createObjectURL(blob)); return urls.get(key); };
  const drop = key => { const u = urls.get(key); if (u) { URL.revokeObjectURL(u); urls.delete(key); } };
  async function refresh(){
    S.items = (await tx('items', 'readonly', s => s.getAll())) || [];
    S.outfits = (await tx('outfits', 'readonly', s => s.getAll())) || [];
    render();
  }
  return {
    mode:'local',
    start: refresh,
    src: it => it ? url('F:' + it.id, it.blob) : '',
    labelSrc: it => it ? url('L:' + it.id, it.labelBlob) : '',
    reload: refresh,
    async addItem(meta, blob, labelBlob, opt){
      opt = opt || {};
      const it = Object.assign({id:opt.id || uid(), createdAt:opt.createdAt || Date.now()}, meta, {blob, labelBlob: labelBlob || null});
      await tx('items', 'readwrite', s => s.put(it));
      if (!opt.bulk) await refresh();
      return it.id;
    },
    async updateItem(id, patch, labelBlob){
      const it = getItem(id); if (!it) return;
      const rec = Object.assign({}, it, patch);
      if (labelBlob) { rec.labelBlob = labelBlob; drop('L:' + id); }
      await tx('items', 'readwrite', s => s.put(rec));
      await refresh();
    },
    async deleteItem(id){
      await tx('items', 'readwrite', s => s.delete(id));
      drop('F:' + id); drop('L:' + id);
      await refresh();
    },
    async addOutfit(o, opt){
      opt = opt || {};
      await tx('outfits', 'readwrite', s => s.put(Object.assign({id:opt.id || uid(), createdAt:opt.createdAt || Date.now()}, o)));
      if (!opt.bulk) await refresh();
    },
    async deleteOutfit(id){
      await tx('outfits', 'readwrite', s => s.delete(id));
      await refresh();
    }
  };
}

function cloudStore(db, assets){
  const items = db.collection('items');
  const outfits = db.collection('outfits');
  return {
    mode:'cloud',
    start(){
      return new Promise(res => {
        let a = false, b = false;
        const done = () => { if (a && b) res(); };
        setTimeout(res, 8000);
        items.onSnapshot(sn => {
          S.items = sn.docs.map(d => Object.assign({id:d.id}, d.data()));
          a = true; done(); if (S.ready) render();
        }, () => { a = true; done(); });
        outfits.onSnapshot(sn => {
          S.outfits = sn.docs.map(d => Object.assign({id:d.id}, d.data()));
          b = true; done(); if (S.ready) render();
        }, () => { b = true; done(); });
      });
    },
    src: it => (it && it.asset) ? '/_blob/' + it.asset : '',
    labelSrc: it => (it && it.label) ? '/_blob/' + it.label : '',
    reload(){ return Promise.resolve(); },
    async addItem(meta, blob, labelBlob, opt){
      opt = opt || {};
      const up = await assets.upload(blob, {type: blob.type || 'image/png'});
      let lab = null;
      if (labelBlob) lab = await assets.upload(labelBlob, {type: labelBlob.type || 'image/jpeg'});
      const id = opt.id || uid();
      await items.doc(id).set(Object.assign({}, meta, {asset:up.id, label: lab ? lab.id : null, createdAt:opt.createdAt || Date.now()}));
      return id;
    },
    async updateItem(id, patch, labelBlob){
      const p = Object.assign({}, patch);
      let old = null;
      if (labelBlob) {
        const up = await assets.upload(labelBlob, {type: labelBlob.type || 'image/jpeg'});
        const it = getItem(id); old = it && it.label; p.label = up.id;
      }
      await items.doc(id).update(p);
      if (old) { try { await assets.delete(old); } catch(e) {} }
    },
    async deleteItem(id){
      const it = getItem(id);
      await items.doc(id).delete();
      if (it && it.asset) { try { await assets.delete(it.asset); } catch(e) {} }
      if (it && it.label) { try { await assets.delete(it.label); } catch(e) {} }
    },
    async addOutfit(o, opt){ opt = opt || {}; await outfits.doc(opt.id || uid()).set(Object.assign({}, o, {createdAt:opt.createdAt || Date.now()})); },
    async deleteOutfit(id){ await outfits.doc(id).delete(); }
  };
}

function loadImg(blob){
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 1000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src = u;
  });
}
async function processImage(blob){
  const im = await loadImg(blob);
  const W = im.naturalWidth, H = im.naturalHeight;
  const k = Math.min(1, 1600 / Math.max(W, H));
  const w = Math.max(1, Math.round(W * k)), h = Math.max(1, Math.round(H * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d', {willReadFrequently:true});
  x.drawImage(im, 0, 0, w, h);
  const d = x.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = -1, maxY = -1, clear = 0;
  for (let yy = 0; yy < h; yy++) {
    const row = yy * w;
    for (let xx = 0; xx < w; xx++) {
      if (d[(row + xx) * 4 + 3] > 16) {
        if (xx < minX) minX = xx; if (xx > maxX) maxX = xx;
        if (yy < minY) minY = yy; if (yy > maxY) maxY = yy;
      } else clear++;
    }
  }
  const transparent = clear > w * h * 0.02 && maxX >= 0;
  let sx = 0, sy = 0, sw = w, sh = h;
  if (transparent) {
    const p = Math.round(Math.max(maxX - minX, maxY - minY) * 0.02);
    sx = Math.max(0, minX - p); sy = Math.max(0, minY - p);
    sw = Math.min(w, maxX + p + 1) - sx; sh = Math.min(h, maxY + p + 1) - sy;
  }
  const k2 = Math.min(1, 900 / Math.max(sw, sh));
  const o = document.createElement('canvas');
  o.width = Math.max(1, Math.round(sw * k2)); o.height = Math.max(1, Math.round(sh * k2));
  const ox = o.getContext('2d');
  ox.imageSmoothingQuality = 'high';
  ox.drawImage(c, sx, sy, sw, sh, 0, 0, o.width, o.height);
  const type = transparent ? 'image/png' : 'image/jpeg';
  const out = await new Promise(r => o.toBlob(r, type, 0.86));
  if (!out) throw new Error('encode');
  let color = null;
  try { color = dominantColor(o, o.width, o.height, transparent); } catch(e) {}
  return {blob:out, w:o.width, h:o.height, transparent, color, preview:URL.createObjectURL(out)};
}
async function processLabel(blob){
  const im = await loadImg(blob);
  const W = im.naturalWidth, H = im.naturalHeight;
  const k = Math.min(1, 1400 / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(W*k)); c.height = Math.max(1, Math.round(H*k));
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  x.drawImage(im, 0, 0, c.width, c.height);

  return {blob:out, preview:URL.createObjectURL(out)};
}

async function readClipboard(){
  if (!navigator.clipboard || !navigator.clipboard.read) throw new Error('unsupported');
  const list = await navigator.clipboard.read();
  for (const it of list) { const t = it.types.find(t => t.indexOf('image/') === 0); if (t) return await it.getType(t); }
  return null;
}
function bindPaste(zone, onBlob){
  zone.addEventListener('paste', e => {
    const cd = e.clipboardData;
    const items = cd ? Array.from(cd.items || []) : [];
    const f = items.find(i => i.kind === 'file' && i.type.indexOf('image/') === 0);
    if (f) { e.preventDefault(); e.stopPropagation(); onBlob(f.getAsFile()); return; }
    const file = cd ? Array.from(cd.files || []).find(f => f.type.indexOf('image/') === 0) : null;
    if (file) { e.preventDefault(); e.stopPropagation(); onBlob(file); return; }
    e.stopPropagation();
    setTimeout(async () => {
      const img = zone.querySelector('img');
      zone.innerHTML = '';
      if (img && img.src) {
        try { onBlob(await (await fetch(img.src)).blob()); }
        catch(err) { toast('Cette image ne passe pas au collage. Utilise « Importer ».'); }
      } else toast('Rien à coller : copie d’abord une image dans Photos.');
    }, 60);
  });
  zone.addEventListener('input', () => { if (!zone.querySelector('img')) zone.textContent = ''; });
  zone.addEventListener('keydown', e => { if (!(e.metaKey || e.ctrlKey)) e.preventDefault(); });
}

  const dirty = new Set(S.basket);

  const pTete = prof().voile === 'toujours' && hasVoile ? 1 : prof().voile === 'parfois' && hasVoile ? .5 : (isChic ? pr.tete * .3 : pr.tete);
  const sig = JSON.stringify([ctx, SLOT_KEYS.filter(locked).map(x => [x, S.current[x]]), S.basket.slice().sort(), S.items.length, prof().voile || '']);
  if (sig !== S.seenSig) { S.seen = new Set(); S.seenSig = sig; }
  let seenHits = 0;
  const cands = [];
  for (let n = 0; n < 800; n++) {
    const c = {};
    const useEns = locked('ensemble') ? true : (locked('haut') || locked('bas')) ? false : Math.random() < pEns;
    const skip = s => (useEns && (s === 'haut' || s === 'bas')) || (!useEns && s === 'ensemble');
    const forced = {};
    for (const col of colorsReq) {
      if (COLOR_SLOTS.some(s => !skip(s) && locked(s) && cname(getItem(S.current[s])) === col)) continue;
      const opts = COLOR_SLOTS.filter(s => !skip(s) && !locked(s) && !forced[s] && pools[s].some(it => cname(it) === col));
      if (opts.length) { const s = rnd(opts); forced[s] = rnd(pools[s].filter(it => cname(it) === col)).id; }
    }
    for (const s of SLOT_KEYS) {
      if (skip(s)) continue;
      if (locked(s)) { c[s] = S.current[s]; continue; }
      if (forced[s]) { c[s] = forced[s]; continue; }
      const P = pools[s]; if (!P.length) continue;
      let p = 1;
      if (s === 'dessus') p = pr.dessus; else if (s === 'tete') p = pTete; else if (s === 'yeux') p = pr.yeux;
      else if (s === 'cou') p = isChic ? Math.max(.5, pr.cou) : pr.cou;
      else if (s === 'visage') p = .5; else if (s === 'sac') p = .25; else if (s === 'ceinture') p = .5;
      else if (s === 'mg') p = .55; else if (s === 'md') p = .3;
      if (Math.random() < p) c[s] = rnd(P).id;
    }
    const pi = getItem(c.pieds);
    if (pi && pi.cat === 'sandales' && !locked('chaussettes')) delete c.chaussettes;
    const bi = getItem(c.bas);
    if (c.ceinture && !locked('ceinture') && !(bi && (bi.cat === 'pantalon' || bi.cat === 'jean' || bi.cat === 'shortjean'))) delete c.ceinture;
    if (c.mg && c.md === c.mg) delete c.md;
    if (colorsReq.length && !colorsReq.every(col => COLOR_SLOTS.some(s => c[s] && cname(getItem(c[s])) === col))) continue;
    const k = JSON.stringify(c);
    if (S.seen.has(k)) { seenHits++; continue; }
    const e = evaluate(c, ctx);
    if (e) cands.push({c, s:e.score, k});
  }
  if (!cands.length) {
    if (seenHits && !retried) { S.seen = new Set(); const r = generate(true); if (r && !r.err) r.cycled = true; return r; }
    return {err:'Aucune combinaison possible avec ces filtres. Élargis la couleur ou l’occasion.'};
  }
  cands.sort((a,b) => b.s - a.s);
  const top = [];
  for (const x of cands) { if (!top.some(t => t.k === x.k)) top.push(x); if (top.length >= 6) break; }
  const pick = S.drawMode === 'best' ? top[0] : pickWeighted(top);
  S.seen.add(pick.k);
  const chosen = pick.c;
  const warn = ['haut','bas','ensemble','pieds'].filter(s => chosen[s] && fb[s] && !locked(s)).map(s => SLOTS[s].ph.toLowerCase());
  return {c:chosen, warn, score:pick.s};
}
function rerollSlot(slot){
  const pool = poolFor(slot, S.ctx).items.filter(it => it.id !== S.current[slot]);
  if (!pool.length) { toast('Pas d’autre pièce propre pour cette zone avec ces filtres.'); return; }
  const scored = pool.map(it => {
    const c = Object.assign({}, S.current); c[slot] = it.id;
    if (slot === 'ensemble') { delete c.haut; delete c.bas; } else if (slot === 'haut' || slot === 'bas') delete c.ensemble;
    const e = evaluate(c, S.ctx);
    return {id:it.id, s: e ? e.score : 50};
  }).sort((a,b) => b.s - a.s);
  setSlot(slot, pickWeighted(scored.slice(0, 4)).id, 1);
}
function availableColors(){
  const dirty = new Set(S.basket);
  const zones = new Set(COLOR_SLOTS.map(s => SLOTS[s].zone));
  const names = new Set();
  S.items.forEach(it => { if (!dirty.has(it.id) && zones.has(CAT_ZONE[it.cat])) { const c = colorOf(it); if (c) names.add(c.name); } });
  (S.ctx.colors || []).forEach(n => names.add(n));
  return PALETTE.filter(p => names.has(p.name));
}

/* =========================================================
   LAUNDRY ENGINE
   ========================================================= */
function caps(){ const m = Number(prof().machine) || 7; return {normal: m * .8, delicat: m * .5, laine: Math.min(2.5, m * .3)}; }
const GROUP_ORDER = ['blanc','clair','couleur','fonce','apart'];
const PROG_RANK = {normal:0, delicat:1, laine:2};
const PROG_LBL = {normal:'Programme coton', delicat:'Programme synthétique / délicat', laine:'Programme laine / très délicat'};
const SPIN = {normal:1000, delicat:800, laine:600};
const isWool = it => !!(it.care && (it.care.cycle === 'tres_delicat' || /laine|cachemire|mohair|alpaga|angora|soie|wool|cashmere|silk/i.test(it.care.compo || '')));
const kgOf = arr => arr.reduce((a, it) => a + ((CATDEF[it.cat] && CATDEF[it.cat].kg) || .3), 0);
function groupLabel(gs){
  const k = gs.slice().sort((a,b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b)).join('+');
  return ({blanc:'Blancs', clair:'Clairs', couleur:'Couleurs', fonce:'Foncés', apart:'À part', 'blanc+clair':'Blancs et clairs', 'couleur+fonce':'Couleurs et foncés'})[k] || 'Mélange';
}
function buildLoads(ids){
  const CAP = caps();
  const out = {loads:[], hand:[], nowash:[], missing:[]};
  const mach = [];
  ids.map(getItem).filter(Boolean).forEach(it => {
    const c = it.care;
    if (!c) out.missing.push(it);
    else if (c.wash === 'non') out.nowash.push(it);
    else if (c.wash === 'main') out.hand.push(it);
    else mach.push(it);
  });
  const progOf = it => isWool(it) ? 'laine' : it.care.cycle === 'delicat' ? 'delicat' : 'normal';
  const grpOf = it => {
    const c = colorOf(it); let g = c ? c.lg : 'couleur';
    if (it.cat === 'jean' || it.cat === 'shortjean') g = 'fonce';
    if (it.care.bleeds && g !== 'fonce') g = 'apart';
    return g;
  };
  const buckets = new Map();
  const key = (g, p) => g + '|' + p;
  mach.forEach(it => {
    const g = grpOf(it), p = progOf(it), k = key(g, p);
    if (!buckets.has(k)) buckets.set(k, {groups:[g], prog:p, items:[]});
    buckets.get(k).items.push(it);
  });
  const merge = (ka, kb) => {
    const a = buckets.get(ka), b = buckets.get(kb);
    if (!a || !b) return;
    b.items = b.items.concat(a.items);
    b.groups = Array.from(new Set(a.groups.concat(b.groups)));
    if (PROG_RANK[a.prog] > PROG_RANK[b.prog]) b.prog = a.prog;
    buckets.delete(ka);
  };
  for (const g of GROUP_ORDER) {
    const kn = key(g, 'normal'), kd = key(g, 'delicat');
    if (buckets.has(kn) && buckets.has(kd) && kgOf(buckets.get(kn).items) + kgOf(buckets.get(kd).items) <= CAP.delicat) merge(kn, kd);
  }
  const FAMILY = g => (g === 'blanc' || g === 'clair') ? 'light' : (g === 'couleur' || g === 'fonce') ? 'dark' : g;
  let merged = true;
  while (merged) {
    merged = false;
    const keys = Array.from(buckets.keys());
    outer: for (let i = 0; i < keys.length; i++) for (let j = i + 1; j < keys.length; j++) {
      const A = buckets.get(keys[i]), B = buckets.get(keys[j]);
      const fam = new Set(A.groups.concat(B.groups).map(FAMILY));
      if (fam.size !== 1 || fam.has('apart')) continue;
      const gentle = PROG_RANK[A.prog] >= PROG_RANK[B.prog] ? A.prog : B.prog;
      const ka = kgOf(A.items), kb = kgOf(B.items);
      if ((ka < 1.5 || kb < 1.5) && ka + kb <= CAP[gentle]) { merge(keys[i], keys[j]); merged = true; break outer; }
    }
  }
  const split = (items, cap) => {
    const sorted = items.slice().sort((a,b) => kgOf([b]) - kgOf([a]));
    const bins = [];
    sorted.forEach(it => {
      const w = kgOf([it]);
      const bin = bins.find(b => b.kg + w <= cap);
      if (bin) { bin.items.push(it); bin.kg += w; } else bins.push({items:[it], kg:w});
    });
    return bins.map(b => b.items);
  };
  for (const B of buckets.values()) split(B.items, CAP[B.prog]).forEach(items => out.loads.push(makeLoad(B, items)));
  out.loads.sort((a,b) => GROUP_ORDER.indexOf(a.tint) - GROUP_ORDER.indexOf(b.tint) || PROG_RANK[a.prog] - PROG_RANK[b.prog]);
  return out;
}
function makeLoad(B, items){
  const temps = items.map(it => it.care.temp || 30);
  let temp = Math.min.apply(null, temps);
  if (B.prog === 'laine') temp = Math.min(temp, 30);
  const lim0 = items.filter(it => (it.care.temp || 30) === temp);
  const limiter = temps.some(t => t !== temp) && lim0.length <= items.length / 2 ? lim0 : [];
  const gs = B.groups.slice().sort((a,b) => GROUP_ORDER.indexOf(a) - GROUP_ORDER.indexOf(b));
  const tint = gs[gs.length - 1];
  const notes = [];
  if (limiter.length && B.prog !== 'laine') notes.push({t:`Limité à ${temp}° par : ${listNames(limiter)}`});
  if (gs.includes('apart')) notes.push({t:'Peut dégorger : à laver seul ou avec des foncés pour les premiers lavages', w:true});
  const inside = items.filter(it => it.cat !== 'chaussettes' && (isDenim(it) || motifOf(it) === 'motif' || (colorOf(it) && colorOf(it).lg === 'fonce')));
  if (B.prog === 'laine') notes.push({t:'Programme laine : essorage doux, pas d’adoucissant'});
  if (inside.length) notes.push({t:`À retourner à l’envers : ${listNames(inside)}`});
  if (items.some(it => ['jean','shortjean','veste','sweat','gilet','sansmanche','manteau','pantalon'].includes(it.cat))) notes.push({t:'Ferme les zips et les boutons avant de lancer'});
  if (items.some(it => it.cat === 'chaussettes')) notes.push({t:'Chaussettes dans un filet pour ne pas les perdre'});
  if (gs.includes('blanc') && !gs.includes('apart')) {
    if (items.every(it => it.care.bleach === 'oui')) notes.push({t:'Javel possible en cas de taches'});
    else if (items.every(it => it.care.bleach !== 'non')) notes.push({t:'Détachant à l’oxygène possible, pas de javel'});
  }
  if (items.some(it => it.cat === 'voile')) notes.push({t:'Voiles dans un filet de lavage'});
  const hasDryer = prof().dryer !== false;
  const dry = {tambour:[], bas:[], air:[], plat:[]};
  items.forEach(it => {
    if (isWool(it)) dry.plat.push(it);
    else if (!hasDryer) dry.air.push(it);
    else if (it.care.dry === 'normal') dry.tambour.push(it);
    else if (it.care.dry === 'doux') dry.bas.push(it);
    else dry.air.push(it);
  });
  const drying = [];
  if (dry.tambour.length) drying.push(`Sèche-linge : ${listNames(dry.tambour)}`);
  if (dry.bas.length) drying.push(`Sèche-linge basse température : ${listNames(dry.bas)}`);
  if (dry.air.length) drying.push(hasDryer ? `À l’air libre : ${listNames(dry.air)}` : `Sur l’étendoir : ${listNames(dry.air)}`);
  if (dry.plat.length) drying.push(`À plat, sans sèche-linge : ${listNames(dry.plat)}`);
  let detergent = 'Lessive couleurs';
  if (B.prog === 'laine') detergent = 'Lessive laine et délicats';
  else if (gs.every(g => g === 'blanc')) detergent = 'Lessive universelle';
  else if (gs.includes('fonce')) detergent = 'Lessive couleurs ou spéciale noir';
  return {items, groups:gs, tint, prog:B.prog, temp, spin:SPIN[B.prog], detergent, kg:kgOf(items), notes, drying};
}

  if (c.wash !== 'non') { if (c.cycle === 'delicat') wash += '<path d="M5 26.5H23"/>'; if (c.cycle === 'tres_delicat') wash += '<path d="M5 26H23M5 28.6H23"/>'; }

/* =========================================================

   ========================================================= */
function setSlot(slot, id, dir){
  if (id) {
    S.current[slot] = id;
    if (slot === 'ensemble') ['haut','bas'].forEach(k => { delete S.current[k]; delete S.locks[k]; });
    else if (slot === 'haut' || slot === 'bas') { delete S.current.ensemble; delete S.locks.ensemble; }
  } else { delete S.current[slot]; delete S.locks[slot]; }
  persist(); renderTenue();
  if (dir) { const img = document.querySelector(`#composer .s-${slot} img`); if (img) img.classList.add(dir > 0 ? 'in-r' : 'in-l'); }
}
function cycle(slot, dir){
  const list = itemsIn(SLOTS[slot].zone);
  if (!list.length) { openPicker(slot); return; }
  let i = list.findIndex(x => x.id === S.current[slot]);
  i = i < 0 ? (dir > 0 ? 0 : list.length - 1) : (i + dir + list.length) % list.length;
  setSlot(slot, list[i].id, dir);
}
function randomize(){
  const r = generate();
  if (!r || r.err) { toast(r ? r.err : 'Impossible de générer une tenue.'); return; }
  S.current = r.c; persist(); renderTenue();
  $$('#composer .slot img').forEach((im, i) => { im.style.animationDelay = (i * 45) + 'ms'; im.classList.add('drop'); });
  if (r.warn && r.warn.length) toast(`Pas de ${r.warn.join(', ')} propre tagué ${tagLabel(S.ctx.occasion)} : pièce hors filtre utilisée.`);
  else if (r.cycled) toast('Tu as vu toutes les meilleures tenues : on repart du début', 'Enregistrer', openSaveOutfit);
  else toast(S.drawMode === 'best' ? `Tenue suivante du classement (${r.score}/100)` : 'Tenue générée', 'Enregistrer', openSaveOutfit);
}
function clearAll(){
  const prev = Object.assign({}, S.current), pl0 = Object.assign({}, S.locks);
  S.current = {}; S.locks = {}; persist(); renderTenue();
  toast('Tenue vidée', 'Annuler', () => { S.current = prev; S.locks = pl0; persist(); renderTenue(); });
}
function addToBasket(ids){
  const set = new Set(S.basket); let added = 0;
  ids.forEach(id => { const it = getItem(id); if (it && isTextile(it) && !set.has(id)) { set.add(id); added++; } });
  S.basket = Array.from(set); saveBasket(); renderNav(); renderLessive(); renderDressing();
  return added;
}
function removeFromBasket(ids){
  const rm = new Set(ids); const prev = S.basket.slice();
  S.basket = S.basket.filter(id => !rm.has(id)); saveBasket(); renderNav(); renderLessive(); renderDressing();
  return prev;
}

let sheetState = null;
function openSheet(html, bind){
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-card" role="dialog" aria-modal="true">${html}</div>`;
  sh.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.add('open')));
  sh.onclick = e => { if (e.target === sh || e.target.closest('[data-close]')) closeSheet(); };
  if (bind) bind(sh.firstElementChild);
}
function closeSheet(){
  const sh = $('#sheet');
  sh.classList.remove('open');
  if (sheetState) {
    [sheetState.img, sheetState.labelImg].forEach(x => { if (x && x.preview) URL.revokeObjectURL(x.preview); });
    if (sheetState.ctl) try { sheetState.ctl.abort(); } catch(e) {}
  }
  sheetState = null;
  setTimeout(() => { if (!sh.classList.contains('open')) { sh.hidden = true; sh.innerHTML = ''; } }, 260);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#sheet').hidden) closeSheet(); });

function catsHTML(onlyZone, sel){

function detailsSummary(st){
  const parts = [];
  if (st.color) parts.push(st.color.name);
  const def = st.cat && CATDEF[st.cat];
  if (def && def.w != null) parts.push(WARM_LBL[st.warmth != null ? st.warmth : def.w].toLowerCase());

  return parts.join(', ') || 'À compléter';

function detailsHTML(st){

const curTags = st => st.tags != null ? st.tags : (st.cat ? (DEF_TAGS[st.cat] || []) : []);
function tagsHTML(st){

function mountTags(root, st){
  const box = $('[data-tags]', root);
  const paint = () => { box.innerHTML = tagsHTML(st); };
  paint();
  const addNew = () => {
    const inp = $('[data-newin]', box);
    const raw = inp.value.trim().replace(/\s+/g, ' ').slice(0, 24);
    if (!raw) return;
    const key = tagKey(raw);
    if (!allTags().includes(key)) { S.customTags = (S.customTags || []).concat([key]); lsSet('penderie.tags', S.customTags); }
    const cur = curTags(st).slice(); if (!cur.includes(key)) cur.push(key);
    st.tags = cur; st.touched.add('tags'); paint();
  };
  box.addEventListener('click', e => {
    const t = e.target.closest('[data-tag]');
    if (t) {
      const cur = curTags(st).slice(), v = t.dataset.tag, i = cur.indexOf(v);
      if (i >= 0) cur.splice(i, 1); else cur.push(v);
      st.tags = cur; st.touched.add('tags'); paint(); return;
    }
    if (e.target.closest('[data-newtag]')) { const nb = $('[data-newbox]', box); nb.hidden = false; $('[data-newin]', box).focus(); return; }
    if (e.target.closest('[data-newok]')) addNew();
  });
  box.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('[data-newin]')) { e.preventDefault(); addNew(); } });
  return paint;
}

  };

  $('[data-lfile]', root).onchange = e => { const f = e.target.files && e.target.files[0]; if (f) takeLabel(f); e.target.value = ''; };
  readBtn.onclick = read;
  $('[data-lmanual]', root).onclick = openEditor;
  paint();
}

function bindAdd(root, st){
  const paste = $('[data-paste]', root), prev = $('[data-prev]', root), warn = $('[data-warn]', root), save = $('[data-save]', root), drop = $('[data-drop]', root), nameIn = $('[data-name]', root);
  const upd = () => { save.disabled = !(st.img && st.cat); };
  const repaintDetails = mountDetails(root, st);
  const repaintTags = mountTags(root, st);
  mountCare(root, st, {});
  nameIn.addEventListener('input', () => st.touched.add('name'));
  const auto = $('[data-auto]', root);
  if (auto) auto.onchange = () => { S.autoAI = auto.checked; lsSet('penderie.autoai', S.autoAI); };
  const markCats = () => $$('[data-cat]', root).forEach(b => b.classList.toggle('on', b.dataset.cat === st.cat));
  $('.cats', root).addEventListener('click', e => {
    const c = e.target.closest('[data-cat]'); if (!c) return;
    st.cat = c.dataset.cat; st.touched.add('cat'); markCats(); repaintDetails(); repaintTags(); upd();
  });
  const analyze = async () => {
    if (!S.ai || !S.autoAI || !st.img) return;
    const tok = st.frontTok = (st.frontTok || 0) + 1;
    setAiStatus(root, 'Claude regarde la pièce', true);
    try {
      const r = await aiFront(st.img.blob);
      if (tok !== st.frontTok || sheetState !== st) return;
      if (r.cat && !st.touched.has('cat') && (!st.onlyZone || CAT_ZONE[r.cat] === st.onlyZone)) st.cat = r.cat;
      ['color','tags','warmth','motif'].forEach(k => { if (r[k] != null && !st.touched.has(k)) st[k] = r[k]; });
      if (r.name && !st.touched.has('name') && !nameIn.value) nameIn.value = r.name;
      markCats(); repaintDetails(); repaintTags(); upd();
      setAiStatus(root, 'Rempli par Claude : vérifie et ajuste si besoin.');
    } catch(e) { if (tok === st.frontTok) setAiStatus(root, aiFail(e)); }
  };
  const take = async blob => {
    if (!blob) return;
    drop.classList.add('busy');
    try {
      const r = await processImage(blob);
      if (st.img && st.img.preview) URL.revokeObjectURL(st.img.preview);
      st.img = r; prev.src = r.preview; prev.hidden = false;
      drop.classList.add('has'); warn.hidden = r.transparent;
      if (r.color && !st.touched.has('color')) st.color = r.color;
      repaintDetails();
      analyze();
    } catch(e) { toast('Image illisible. Essaie une autre photo.'); }
    finally { drop.classList.remove('busy'); paste.innerHTML = ''; paste.blur(); upd(); }
  };
  st.take = take;
  bindPaste(paste, take);
  $('[data-clip]', root).onclick = async () => {
    try { const b = await readClipboard(); if (b) take(b); else toast('Aucune image dans le presse-papier. Copie d’abord un vêtement dans Photos.'); }
    catch(e) { paste.focus(); toast('Collage direct bloqué ici : appui long dans le cadre, puis « Coller ».'); }
  };
  $('[data-file]', root).onchange = e => { const f = e.target.files && e.target.files[0]; if (f) take(f); e.target.value = ''; };
  const resetForNext = () => {
    [st.img, st.labelImg].forEach(x => { if (x && x.preview) URL.revokeObjectURL(x.preview); });
    st.img = null; st.labelImg = null; st.care = null; st.color = null; st.warmth = null; st.motif = 'uni';
    const keepTags = st.touched.has('tags') ? st.tags : null;
    st.tags = keepTags;
    st.touched = new Set(keepTags ? ['cat','tags'] : ['cat']);
    prev.hidden = true; prev.removeAttribute('src'); drop.classList.remove('has'); warn.hidden = true;
    const lp = $('[data-lprev]', root); lp.hidden = true; lp.removeAttribute('src'); $('[data-ldrop]', root).classList.remove('has');
    const ed = $('[data-ceditor]', root); ed.hidden = true; ed.innerHTML = '';
    nameIn.value = ''; setAiStatus(root, '');
    repaintDetails(); repaintTags(); mountCareRepaint(root, st); upd();
  };
  save.onclick = async () => {
    if (!st.img || !st.cat) return;
    const label = save.textContent;
    save.disabled = true; save.textContent = 'Ajout…';
    try {
      const meta = {cat:st.cat, name:nameIn.value.trim(), w:st.img.w, h:st.img.h, transparent:st.img.transparent,
        color:st.color || null, tags:curTags(st).slice(), style:null, warmth:st.warmth, motif:st.motif || 'uni', care:st.care || null};
      const id = await S.store.addItem(meta, st.img.blob, st.labelImg ? st.labelImg.blob : null);
      if (st.slot) { setSlot(st.slot, id, 1); closeSheet(); toast('Ajouté à la tenue'); }
      else { save.textContent = label; resetForNext(); toast('Pièce ajoutée. Colle la suivante.'); }
    } catch(err) { save.textContent = label; upd(); toast(errMsg(err)); }
  };
}

/* =========================================================
   SAUVEGARDE : export / import (.zip)
   ========================================================= */
const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(u8){ let c = 0xFFFFFFFF; for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function makeZip(files){
  const enc = new TextEncoder(), parts = [], central = [];
  const d = new Date();
  const dosT = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const dosD = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  let offset = 0;
  for (const f of files) {

    <p class="how">Le profil adapte les catégories proposées (le qamis pour un homme ; robe, jupe, abaya, talons et voile pour une femme). Les pièces déjà ajoutées restent visibles.</p>`;
  openSheet(`<div class="sh-head"><h2>Réglages</h2>${closeBtn}</div><div data-set>${body()}</div>
    <div class="row2"><button type="button" class="btn" data-bk>${ic('backup', 18)}Sauvegarde</button><button type="button" class="btn" data-onb>Revoir l’accueil</button></div>`, root => {
    const box = $('[data-set]', root);
    box.addEventListener('click', e => {
      const o = e.target.closest('[data-k]'); if (!o) return;
      const k = o.dataset.k, v = o.dataset.v;
      a[k] = k === 'machine' ? Number(v) : k === 'dryer' ? v === 'true' : v;
      if (k === 'sexe' && v === 'homme') a.voile = 'non';
      saveProfile(a);
      if (k === 'style') { S.ctx.occasion = v; lsSet('penderie.ctx', S.ctx); }
      box.innerHTML = body(); render();
    });
    $('[data-bk]', root).onclick = () => openBackup();
    $('[data-onb]', root).onclick = () => { closeSheet(); openOnboarding(); };
  });
}

/* =========================================================
   GLOBAL EVENTS
   ========================================================= */
document.addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#sheet')) return;
  const tab = t.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; renderNav(); window.scrollTo(0, 0); return; }
  const dm = t.closest('[data-draw]');
  if (dm) { S.drawMode = dm.dataset.draw; lsSet('penderie.drawmode', S.drawMode); S.seen = new Set(); renderTenue(); return; }
  const cf = t.closest('[data-colf]');
  if (cf) {
    const v = cf.dataset.colf; let cols = (S.ctx.colors || []).slice();
    if (!v) cols = []; else if (cols.includes(v)) cols = cols.filter(x => x !== v); else { cols.push(v); if (cols.length > 2) cols.shift(); }
    S.ctx.colors = cols; lsSet('penderie.ctx', S.ctx); renderTenue(); return;
  }
  const cx = t.closest('[data-ctxk]');
  if (cx) { S.ctx[cx.dataset.ctxk] = cx.dataset.ctxv; lsSet('penderie.ctx', S.ctx); renderTenue(); return; }
  const act = t.closest('[data-act]');
  if (act) {
    const a = act.dataset.act;
    if (a === 'add') openAdd();
    else if (a === 'random') randomize();
    else if (a === 'clear') clearAll();
    else if (a === 'save') openSaveOutfit();
    else if (a === 'rules') openRules();
    else if (a === 'backup') openBackup();
    else if (a === 'settings') openSettings();
    else if (a === 'unlock') { S.locks = {}; persist(); renderTenue(); toast('Toutes les pièces sont libérées'); }
    else if (a === 'basket-add') openBasketPicker();
    else if (a === 'outfit-basket') {
      const n = addToBasket(SLOT_KEYS.map(k => S.current[k]).filter(Boolean));
      renderTenue();
      toast(n ? `${pl(n, 'pièce ajoutée', 'pièces ajoutées')} au linge sale` : 'Déjà au linge sale');
    }
    else if (a === 'basket-rm') { const prev = removeFromBasket([act.dataset.id]); toast('Retiré du panier', 'Annuler', () => { S.basket = prev; saveBasket(); render(); }); }
    else if (a === 'basket-clear') { const prev = removeFromBasket(S.basket.slice()); toast('Panier vidé', 'Annuler', () => { S.basket = prev; saveBasket(); render(); }); }
    else if (a === 'load-done' && S.plan) {
      const L = S.plan.loads[Number(act.dataset.load)];
      if (L) { const prev = removeFromBasket(L.items.map(i => i.id)); toast('Machine terminée', 'Annuler', () => { S.basket = prev; saveBasket(); render(); }); }
    }
    else if (a === 'hand-done' && S.plan) { const prev = removeFromBasket(S.plan.hand.map(i => i.id)); toast('Lavage à la main terminé', 'Annuler', () => { S.basket = prev; saveBasket(); render(); }); }
    return;
  }
  const f = t.closest('[data-filter]');
  if (f) { S.filter = f.dataset.filter; renderDressing(); return; }
  const it = t.closest('[data-item]');
  if (it) { openItem(it.dataset.item); return; }
  const o = t.closest('[data-outfit]');
  if (o) openOutfit(o.dataset.outfit);
});

(function bindComposer(){
  const vt = $('#v-tenue');
  let drag = null, suppress = false, lp = null;
  const cancelLp = () => { if (lp) { clearTimeout(lp); lp = null; } };
  vt.addEventListener('contextmenu', e => { if (e.target.closest('#composer')) e.preventDefault(); });
  vt.addEventListener('pointerdown', e => {
    const s = e.target.closest('#composer .slot');
    drag = s ? {slot:s.dataset.slot, x:e.clientX, y:e.clientY} : null;
    cancelLp();
    if (s && s.classList.contains('full')) {
      const slot = s.dataset.slot;
      lp = setTimeout(() => {
        lp = null;
        if (!drag || drag.slot !== slot) return;
        drag = null; suppress = true; setTimeout(() => { suppress = false; }, 700);
        if (S.locks[slot]) delete S.locks[slot]; else S.locks[slot] = true;
        persist(); renderTenue();
        toast(S.locks[slot] ? 'Pièce gardée au prochain tirage' : 'Pièce libérée');
        if (navigator.vibrate) try { navigator.vibrate(15); } catch(err) {}
      }, 480);
    }
  });
  vt.addEventListener('pointermove', e => { if (drag && (Math.abs(e.clientX - drag.x) > 10 || Math.abs(e.clientY - drag.y) > 10)) cancelLp(); });
  vt.addEventListener('pointercancel', () => { drag = null; cancelLp(); });
  vt.addEventListener('pointerup', e => {
    cancelLp();
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y, slot = drag.slot;
    drag = null;
    if (Math.abs(dx) > 34 && Math.abs(dx) > Math.abs(dy) * 1.2) { suppress = true; setTimeout(() => { suppress = false; }, 400); cycle(slot, dx < 0 ? 1 : -1); }
  });
  vt.addEventListener('click', e => {
    const s = e.target.closest('#composer .slot'); if (!s) return;
    if (suppress) { suppress = false; return; }
    openPicker(s.dataset.slot);
  });
})();

/* =========================================================
   BOOT
   ========================================================= */
function makeIcon(){
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const x = c.getContext('2d');
    x.fillStyle = '#1C2638'; x.fillRect(0, 0, 180, 180);
    x.strokeStyle = '#F7F8F6'; x.lineWidth = 8; x.lineCap = 'round'; x.lineJoin = 'round';
    x.beginPath(); x.arc(90, 50, 13, Math.PI, Math.PI * 2.35); x.lineTo(90, 74); x.stroke();
    x.beginPath(); x.moveTo(90, 74); x.lineTo(30, 122); x.lineTo(150, 122); x.closePath(); x.stroke();
    x.strokeStyle = '#E45C7D'; x.lineWidth = 5; x.setLineDash([10, 8]);
    x.beginPath(); x.moveTo(42, 146); x.lineTo(138, 146); x.stroke();
    const l = document.createElement('link'); l.rel = 'apple-touch-icon'; l.href = c.toDataURL('image/png');
    document.head.appendChild(l);
  } catch(e) {}
}
async function initAI(){
  try {
    if (!(window.claude && typeof window.claude.use === 'function')) return;
    const smp = await window.claude.use('sample');
    if (!smp) return;
    let lim = null;
    try { lim = await smp.limits(); } catch(e) {}
    if (lim && lim.images) S.ai = {sample:smp};
  } catch(e) {}
}
async function init(){
  makeIcon();
  render();
  let store = null;
  const aiP = initAI();
  if (window.claude && typeof window.claude.use === 'function') window.claude.use('downloads').then(d => { S.downloads = d; }).catch(() => {});
  try {
    if (window.claude && typeof window.claude.use === 'function') {
      const res = await Promise.all([window.claude.use('db'), window.claude.use('assets')]);
      if (res[0] && res[1]) store = cloudStore(res[0], res[1]);
    }
  } catch(e) {}
  if (!store) store = localStore();
  S.store = store; S.mode = store.mode;
  try { await store.start(); } catch(e) { toast('Impossible de charger le dressing.'); }
  S.ready = true;
  render();
  if (!prof().done) openOnboarding();
  aiP.then(() => { if (S.ai && sheetState) { /* next sheet will show AI options */ } });
}
window.__penderie = {S, openOnboarding, hiddenCats, caps, evaluate, generate, buildLoads, render, makeZip, readZip, buildBackup, runImport, rerollSlot, tagsOf};
init();
})();
